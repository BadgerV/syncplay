[package]
name = "syncplay"
version = "0.1.0"
edition = "2021"
description = "Stream system audio from one Mac to multiple Macs on the same LAN with synchronized playback"

[dependencies]
# Audio
cpal = "0.15"

# Networking
mdns-sd = "0.11"
socket2 = { version = "0.5", features = ["all"] }

# Serialization
serde = { version = "1", features = ["derive"] }
bincode = "1"

# Concurrency
crossbeam-channel = "0.5"
parking_lot = "0.12"
ringbuf = "0.4"

# GUI
eframe = "0.31"
egui = "0.31"

# Utilities
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
screencapturekit = "8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
